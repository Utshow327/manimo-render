name: Render Manim
on:
  push:
    paths: ['scene.py', 'voice_config.json', 'render_config.json']
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Edge-TTS
        run: pipx install edge-tts

      - name: Read config
        id: config
        run: |
          if [ -f render_config.json ]; then
            HASH=$(python3 -c "import json; print(json.load(open('render_config.json')).get('hash','none'))")
          else
            HASH=$(sha256sum scene.py | cut -c1-12)
          fi
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Render Video (Docker)
        run: |
          # Use official manim docker image to skip environment setup time
          # Append || true to prevent failure emails
          docker run --rm -v $(pwd):/manim -w /manim manimcommunity/manim:latest manim render -qh -o output.mp4 scene.py MainScene > manim.log 2>&1 || true

      - name: Generate Voice
        run: |
          if [ -f voice_config.json ]; then
            TEXT=$(python3 -c "import json; d=json.load(open('voice_config.json')); print(d.get('text',''))")
            VOICE=$(python3 -c "import json; d=json.load(open('voice_config.json')); print(d.get('voice','en-GB-RyanNeural'))")
            if [ -n "$TEXT" ]; then
              edge-tts --text "$TEXT" --voice "$VOICE" --write-media narration.mp3
              VIDEO=$(find media -name "output.mp4" | head -1)
              if [ -f narration.mp3 ] && [ -n "$VIDEO" ]; then
                ffmpeg -y -i "$VIDEO" -i narration.mp3 -c:v copy -c:a aac -b:a 192k -filter_complex "[1:a]apad[a]" -map 0:v -map "[a]" -shortest merged.mp4
                sudo cp merged.mp4 "$VIDEO"
              fi
            fi
          fi

      - name: Find output
        id: find
        run: |
          VIDEO=$(find media -name "output.mp4" | head -1)
          if [ -z "$VIDEO" ]; then
            echo "video=" >> $GITHUB_OUTPUT
          else
            echo "video=$VIDEO" >> $GITHUB_OUTPUT
          fi
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ steps.config.outputs.hash }}
          name: Render ${{ steps.config.outputs.hash }}
          files: |
            ${{ steps.find.outputs.video }}
            manim.log
          make_latest: true